name: Native runtime and VSIX validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: 42.7.1
  ELECTRON_ABI: '146'
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 9.15.4
  ELECTRON_REBUILD_VERSION: 4.2.0
  BETTER_SQLITE3_VERSION: 12.11.1

jobs:
  native:
    name: native-${{ matrix.target }}-${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-win32-x64.zip
          - runner: ubuntu-22.04
            target: linux-x64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-linux-x64.zip
          - runner: ubuntu-22.04
            target: linux-x64
            runtime: node
            node: 22.23.2
            builder-node: 24.19.0
            electron-archive: ''
          - runner: macos-15-intel
            target: darwin-x64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-darwin-x64.zip
          - runner: macos-15
            target: darwin-arm64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-darwin-arm64.zip

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Assert runtime tuple
        shell: bash
        run: |
          test "$(node --version)" = "v${{ matrix.node }}"
          test "$(node --version)" = "v22.23.2"
          pnpm --version | grep -Fx "${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert frozen dependencies
        shell: bash
        run: |
          node -e "const p=require('./apps/vscode-extension/node_modules/@electron/rebuild/package.json');if(p.version!=='4.2.0')throw new Error('unexpected @electron/rebuild '+p.version)"
          node -e "const p=require('./apps/vscode-extension/node_modules/better-sqlite3/package.json');if(p.version!=='12.11.1')throw new Error('unexpected better-sqlite3 '+p.version)"

      - name: Set up Linux Node ABI builder
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.builder-node }}

      - name: Assert Linux Node ABI builder
        if: matrix.runtime == 'node'
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(node -p 'process.versions.modules')" = "137"

      - name: Resolve Electron runtime
        if: matrix.runtime == 'electron'
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/project-dna-electron-${NATIVE_TARGET}"
          mkdir -p "$runtime_root"
          archive="${{ matrix['electron-archive'] }}"
          curl --fail --location --retry 3 --output "$runtime_root/$archive" "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/$archive"
          curl --fail --location --retry 3 --output "$runtime_root/SHASUMS256.txt" "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/SHASUMS256.txt"
          expected="$(awk -v name="$archive" '$2 == "*" name {print $1}' "$runtime_root/SHASUMS256.txt")"
          test -n "$expected"
          actual="$(
            node -e "
              const fs = require('node:fs');
              const crypto = require('node:crypto');
              const file = process.argv[1];
              process.stdout.write(
                crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
              );
            " "$runtime_root/$archive"
          )"
          test "$actual" = "$expected"
          unzip -q "$runtime_root/$archive" -d "$runtime_root/app"
          if [ "${{ matrix.target }}" = "win32-x64" ]; then
            echo "ELECTRON_EXECUTABLE=$runtime_root/app/electron.exe" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == darwin-* ]]; then
            echo "ELECTRON_EXECUTABLE=$runtime_root/app/Electron.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          else
            echo "ELECTRON_EXECUTABLE=$runtime_root/app/electron" >> "$GITHUB_ENV"
          fi

      - name: Build native binding from source
        working-directory: apps/vscode-extension
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: pnpm build:native

      - name: Validate native artifact path and ABI
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          if [ "$NATIVE_RUNTIME" = node ]; then suffix=node-abi137; else suffix=electron-abi146; fi
          artifact="native/$NATIVE_TARGET/$suffix/better_sqlite3.node"
          test -s "$artifact"
          test "$(find native -type f -name better_sqlite3.node | wc -l | tr -d '[:space:]')" = 1

      - name: Run existing verification gates
        if: matrix.runtime == 'electron'
        run: pnpm verify

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-${{ matrix.runtime }}
          path: native
          if-no-files-found: error
          retention-days: 7

  package:
    name: package-${{ matrix.target }}
    needs: native
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64, darwin-x64, darwin-arm64]

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download target native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-${{ matrix.target }}-*
          path: native
          merge-multiple: true

      - name: Validate target native inputs
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(
            node -e "
              const fs = require('node:fs');
              const contract = JSON.parse(
                fs.readFileSync('apps/vscode-extension/release-contract.json', 'utf8')
              );
              process.stdout.write(contract.vsix.nativeBindings[process.env.NATIVE_TARGET].join('\n'));
            "
          )
          for artifact in "${artifacts[@]}"; do
            test -s "$artifact"
          done
          test "$(find native -type f -name better_sqlite3.node | wc -l | tr -d '[:space:]')" = "${#artifacts[@]}"

      - name: Build extension and package twice
        working-directory: apps/vscode-extension
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: electron
          SOURCE_DATE_EPOCH: '315532800'
          BUILD_COMMIT: ${{ github.sha }}
        run: pnpm package:vsix

      - name: Validate VSIX extraction
        working-directory: apps/vscode-extension
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: electron
        run: |
          set -euo pipefail
          unzip -t release/project-dna-a.vsix
          rm -rf release/extracted
          mkdir -p release/extracted
          unzip -q release/project-dna-a.vsix -d release/extracted
          test -d release/extracted/extension
          STAGING_DIR=release/extracted/extension node scripts/validate-package.mjs

      - name: Upload VSIX and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: project-dna-vsix-${{ matrix.target }}
          path: |
            apps/vscode-extension/release/project-dna-a.vsix
            apps/vscode-extension/release/project-dna-b.vsix
            apps/vscode-extension/release/integrity.json
          if-no-files-found: error
          retention-days: 7

  installed-extension-host-linux-x64:
    name: installed-extension-host-linux-x64
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download canonical VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: project-dna-vsix-linux-x64
          path: apps/vscode-extension/release

      - name: Install pinned Playwright Chromium
        working-directory: apps/vscode-extension
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/project-dna-playwright-1.62.1
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate installed VSIX in official VS Code Server
        working-directory: apps/vscode-extension
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/project-dna-playwright-1.62.1
        run: pnpm validate:installed-server

      - name: Upload installed Extension Host logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installed-extension-host-linux-x64-logs
          path: ${{ runner.temp }}/project-dna-installed-server/logs
          if-no-files-found: ignore
          retention-days: 7
