name: Native runtime and VSIX validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: 42.7.1
  ELECTRON_ABI: '146'
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 9.15.4
  ELECTRON_REBUILD_VERSION: 4.2.0
  BETTER_SQLITE3_VERSION: 12.11.1

jobs:
  native:
    name: native-${{ matrix.target }}-${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            runtime: electron
            node: 22.23.2
            electron-archive: electron-v42.7.1-win32-x64.zip
          - runner: ubuntu-22.04
            target: linux-x64
            runtime: electron
            node: 22.23.2
            electron-archive: electron-v42.7.1-linux-x64.zip
          - runner: ubuntu-22.04
            target: linux-x64
            runtime: node
            node: 24.19.0
            electron-archive: ''
          - runner: macos-15-intel
            target: darwin-x64
            runtime: electron
            node: 22.23.2
            electron-archive: electron-v42.7.1-darwin-x64.zip
          - runner: macos-15
            target: darwin-arm64
            runtime: electron
            node: 22.23.2
            electron-archive: electron-v42.7.1-darwin-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Assert runtime tuple
        shell: bash
        run: |
          test "$(node --version)" = "v${{ matrix.node }}"
          if [ "${{ matrix.runtime }}" = "node" ]; then
            test "$(node -p 'process.versions.modules')" = "137"
          else
            test "$(node --version)" = "v22.23.2"
          fi
          pnpm --version | grep -Fx "${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert frozen dependencies
        shell: bash
        run: |
          node -e "const p=require('./apps/vscode-extension/node_modules/@electron/rebuild/package.json');if(p.version!=='4.2.0')throw new Error('unexpected @electron/rebuild '+p.version)"
          node -e "const p=require('./apps/vscode-extension/node_modules/better-sqlite3/package.json');if(p.version!=='12.11.1')throw new Error('unexpected better-sqlite3 '+p.version)"

      - name: Resolve Electron runtime
        if: matrix.runtime == 'electron'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .electron-runtime
          archive="${{ matrix['electron-archive'] }}"
          curl --fail --location --retry 3 --output ".electron-runtime/$archive" "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/$archive"
          curl --fail --location --retry 3 --output .electron-runtime/SHASUMS256.txt "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/SHASUMS256.txt"
          expected="$(awk -v name="$archive" '$2 == "*" name {print $1}' .electron-runtime/SHASUMS256.txt)"
          test -n "$expected"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum ".electron-runtime/$archive" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 ".electron-runtime/$archive" | awk '{print $1}')"
          fi
          test "$actual" = "$expected"
          unzip -q ".electron-runtime/$archive" -d .electron-runtime/app
          if [ "${{ matrix.target }}" = "win32-x64" ]; then
            echo "ELECTRON_EXECUTABLE=$GITHUB_WORKSPACE/.electron-runtime/app/electron.exe" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == darwin-* ]]; then
            echo "ELECTRON_EXECUTABLE=$GITHUB_WORKSPACE/.electron-runtime/app/Electron.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          else
            echo "ELECTRON_EXECUTABLE=$GITHUB_WORKSPACE/.electron-runtime/app/electron" >> "$GITHUB_ENV"
          fi

      - name: Build native binding from source
        working-directory: apps/vscode-extension
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: pnpm build:native

      - name: Validate native artifact path and ABI
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          if [ "$NATIVE_RUNTIME" = node ]; then suffix=node-abi137; else suffix=electron-abi146; fi
          artifact="native/$NATIVE_TARGET/$suffix/better_sqlite3.node"
          test -s "$artifact"
          test "$(find native -type f -name better_sqlite3.node | wc -l)" = 1

      - name: Run existing verification gates
        if: matrix.runtime == 'electron'
        run: pnpm verify

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-${{ matrix.runtime }}
          path: native
          if-no-files-found: error
          retention-days: 7

  package:
    name: package-linux-x64
    needs: native
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
          merge-multiple: true

      - name: Validate complete native matrix
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            native/win32-x64/electron-abi146/better_sqlite3.node \
            native/linux-x64/electron-abi146/better_sqlite3.node \
            native/linux-x64/node-abi137/better_sqlite3.node \
            native/darwin-x64/electron-abi146/better_sqlite3.node \
            native/darwin-arm64/electron-abi146/better_sqlite3.node; do
            test -s "$artifact"
          done
          test "$(find native -type f -name better_sqlite3.node | wc -l)" = 5

      - name: Build extension and package twice
        working-directory: apps/vscode-extension
        env:
          NATIVE_TARGET: linux-x64
          NATIVE_RUNTIME: electron
          SOURCE_DATE_EPOCH: '315532800'
          BUILD_COMMIT: ${{ github.sha }}
        run: pnpm package:vsix

      - name: Validate VSIX extraction
        working-directory: apps/vscode-extension
        shell: bash
        env:
          NATIVE_TARGET: linux-x64
          NATIVE_RUNTIME: electron
        run: |
          set -euo pipefail
          unzip -t release/project-dna-a.vsix
          rm -rf release/extracted
          mkdir -p release/extracted
          unzip -q release/project-dna-a.vsix -d release/extracted
          test -d release/extracted/extension
          STAGING_DIR=release/extracted/extension node scripts/validate-package.mjs

      - name: Upload VSIX and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: project-dna-vsix
          path: |
            apps/vscode-extension/release/project-dna-a.vsix
            apps/vscode-extension/release/project-dna-b.vsix
            apps/vscode-extension/release/integrity.json
          if-no-files-found: error
          retention-days: 7
