name: Native runtime and VSIX validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: 42.7.1
  ELECTRON_ABI: '146'
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 9.15.4
  ELECTRON_REBUILD_VERSION: 4.2.0
  BETTER_SQLITE3_VERSION: 12.11.1

jobs:
  native:
    name: native-${{ matrix.target }}-${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-win32-x64.zip
          - runner: ubuntu-22.04
            target: linux-x64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-linux-x64.zip
          - runner: ubuntu-22.04
            target: linux-x64
            runtime: node
            node: 22.23.2
            builder-node: 24.19.0
            electron-archive: ''
          - runner: macos-15-intel
            target: darwin-x64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-darwin-x64.zip
          - runner: macos-15
            target: darwin-arm64
            runtime: electron
            node: 22.23.2
            builder-node: ''
            electron-archive: electron-v42.7.1-darwin-arm64.zip

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Assert runtime tuple
        shell: bash
        run: |
          test "$(node --version)" = "v${{ matrix.node }}"
          test "$(node --version)" = "v22.23.2"
          pnpm --version | grep -Fx "${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert frozen dependencies
        shell: bash
        run: |
          node -e "const p=require('./apps/vscode-extension/node_modules/@electron/rebuild/package.json');if(p.version!=='4.2.0')throw new Error('unexpected @electron/rebuild '+p.version)"
          node -e "const p=require('./apps/vscode-extension/node_modules/better-sqlite3/package.json');if(p.version!=='12.11.1')throw new Error('unexpected better-sqlite3 '+p.version)"

      - name: Set up Linux Node ABI builder
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.builder-node }}

      - name: Assert Linux Node ABI builder
        if: matrix.runtime == 'node'
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(node -p 'process.versions.modules')" = "137"

      - name: Resolve Electron runtime
        if: matrix.runtime == 'electron'
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/project-dna-electron-${NATIVE_TARGET}"
          mkdir -p "$runtime_root"
          archive="${{ matrix['electron-archive'] }}"
          curl --fail --location --retry 3 --output "$runtime_root/$archive" "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/$archive"
          curl --fail --location --retry 3 --output "$runtime_root/SHASUMS256.txt" "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/SHASUMS256.txt"
          expected="$(awk -v name="$archive" '$2 == "*" name {print $1}' "$runtime_root/SHASUMS256.txt")"
          test -n "$expected"
          actual="$(
            node -e "
              const fs = require('node:fs');
              const crypto = require('node:crypto');
              const file = process.argv[1];
              process.stdout.write(
                crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
              );
            " "$runtime_root/$archive"
          )"
          test "$actual" = "$expected"
          unzip -q "$runtime_root/$archive" -d "$runtime_root/app"
          if [ "${{ matrix.target }}" = "win32-x64" ]; then
            echo "ELECTRON_EXECUTABLE=$runtime_root/app/electron.exe" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == darwin-* ]]; then
            echo "ELECTRON_EXECUTABLE=$runtime_root/app/Electron.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          else
            echo "ELECTRON_EXECUTABLE=$runtime_root/app/electron" >> "$GITHUB_ENV"
          fi

      - name: Build native binding from source
        working-directory: apps/vscode-extension
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: pnpm build:native

      - name: Validate native artifact path and ABI
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          if [ "$NATIVE_RUNTIME" = node ]; then suffix=node-abi137; else suffix=electron-abi146; fi
          artifact="native/$NATIVE_TARGET/$suffix/better_sqlite3.node"
          test -s "$artifact"
          test "$(find native -type f -name better_sqlite3.node | wc -l | tr -d '[:space:]')" = 1

      - name: Run non-performance verification gates
        if: matrix.runtime == 'electron'
        run: |
          pnpm check:workspace
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm exec turbo run test --filter='!@project-dna/impact-engine'
          pnpm --filter @project-dna/impact-engine exec vitest run --exclude '**/impact-performance.test.ts'
          pnpm build

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-${{ matrix.runtime }}
          path: native
          if-no-files-found: error
          retention-days: 7

  impact-performance:
    name: impact-performance-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Assert performance runtime tuple
        shell: bash
        run: |
          test "$(node --version)" = "v22.23.2"
          pnpm --version | grep -Fx "9.15.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unchanged ImpactEngine performance gate
        run: pnpm --filter @project-dna/impact-engine exec vitest run src/__tests__/impact-performance.test.ts

  package:
    name: package-${{ matrix.target }}
    needs: native
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64, darwin-x64, darwin-arm64]

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download target native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-${{ matrix.target }}-*
          path: native
          merge-multiple: true

      - name: Validate target native inputs
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(
            node -e "
              const fs = require('node:fs');
              const contract = JSON.parse(
                fs.readFileSync('apps/vscode-extension/release-contract.json', 'utf8')
              );
              process.stdout.write(contract.vsix.nativeBindings[process.env.NATIVE_TARGET].join('\n'));
            "
          )
          for artifact in "${artifacts[@]}"; do
            test -s "$artifact"
          done
          test "$(find native -type f -name better_sqlite3.node | wc -l | tr -d '[:space:]')" = "${#artifacts[@]}"

      - name: Build extension and package twice
        working-directory: apps/vscode-extension
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: electron
          SOURCE_DATE_EPOCH: '315532800'
          BUILD_COMMIT: ${{ github.sha }}
        run: pnpm package:vsix

      - name: Validate VSIX extraction
        working-directory: apps/vscode-extension
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_RUNTIME: electron
        run: |
          set -euo pipefail
          unzip -t release/project-dna-a.vsix
          rm -rf release/extracted
          mkdir -p release/extracted
          unzip -q release/project-dna-a.vsix -d release/extracted
          test -d release/extracted/extension
          STAGING_DIR=release/extracted/extension node scripts/validate-package.mjs

      - name: Upload VSIX and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: project-dna-vsix-${{ matrix.target }}
          path: |
            apps/vscode-extension/release/project-dna-a.vsix
            apps/vscode-extension/release/project-dna-b.vsix
            apps/vscode-extension/release/integrity.json
          if-no-files-found: error
          retention-days: 7

  installed-extension-host-linux-x64:
    name: installed-extension-host-linux-x64
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download canonical VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: project-dna-vsix-linux-x64
          path: apps/vscode-extension/release

      - name: Install pinned Playwright Chromium
        working-directory: apps/vscode-extension
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/project-dna-playwright-1.62.1
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate installed VSIX in official VS Code Server
        working-directory: apps/vscode-extension
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/project-dna-playwright-1.62.1
        run: pnpm validate:installed-server

      - name: Upload installed Extension Host logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installed-extension-host-linux-x64-logs
          path: ${{ runner.temp }}/project-dna-installed-server/logs
          if-no-files-found: ignore
          retention-days: 7

  compatibility-desktop:
    name: compatibility-${{ matrix.target }}-vscode-${{ matrix.vscode_version }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            vscode_version: 1.132.0
            archive_channel: win32-x64-archive
            archive_sha256: 98bd4a4721a5bd8534dbad8eaf9801f001ee36703a278c5d52d6036df8c7e503
            electron_version: 42.7.1
          - runner: windows-2025
            target: win32-x64
            vscode_version: 1.132.1
            archive_channel: win32-x64-archive
            archive_sha256: 405f9e096b2cd9489a35c4c458c38badcf10374b64c529a6a9cab3c0e5463172
            electron_version: 42.7.1
          - runner: windows-2025
            target: win32-x64
            vscode_version: 1.133.0
            archive_channel: win32-x64-archive
            archive_sha256: 2073ae64f09564ab76c583c5553e2c76de96e4d78efc27e4e9aaec8430bf5229
            electron_version: 42.8.0
          - runner: windows-2025
            target: win32-x64
            vscode_version: 1.134.0
            archive_channel: win32-x64-archive
            archive_sha256: 59d3e1816961abb53d3bcc264083ee7e3f2282a6ff1004c4a1a8411b92a7a45d
            electron_version: 42.8.1
          - runner: ubuntu-22.04
            target: linux-x64
            vscode_version: 1.132.0
            archive_channel: linux-x64
            archive_sha256: acdaf0fa557bda1720956ff65ca0de0965e92d68f97e2db22341984400937aed
            electron_version: 42.7.1
          - runner: ubuntu-22.04
            target: linux-x64
            vscode_version: 1.132.1
            archive_channel: linux-x64
            archive_sha256: 78a84fdf4cf756b3110623c8d1dce96c582613fe71d15a6a3f1343619092c04e
            electron_version: 42.7.1
          - runner: ubuntu-22.04
            target: linux-x64
            vscode_version: 1.133.0
            archive_channel: linux-x64
            archive_sha256: 2bf1a90d2f008af009eb3c4a7bd0849b9247a0588cd39a404a0b1e691be68161
            electron_version: 42.8.0
          - runner: ubuntu-22.04
            target: linux-x64
            vscode_version: 1.134.0
            archive_channel: linux-x64
            archive_sha256: 9336170079f527f1ca62dad39947b020db06bd3e8cae7e1e6097bea594f37733
            electron_version: 42.8.1
          - runner: macos-15-intel
            target: darwin-x64
            vscode_version: 1.132.0
            archive_channel: darwin
            archive_sha256: 1fb68a8a6357190942a36623ca784937b1226b0b5508a6281aa6fe5328c58db6
            electron_version: 42.7.1
          - runner: macos-15-intel
            target: darwin-x64
            vscode_version: 1.132.1
            archive_channel: darwin
            archive_sha256: 95ebef891aefe998d9879a559c399a55dfadcb0aeebb48de75d1dda5de79f379
            electron_version: 42.7.1
          - runner: macos-15-intel
            target: darwin-x64
            vscode_version: 1.133.0
            archive_channel: darwin
            archive_sha256: 8fa12ce73e5c3ea5fe3927227047ac483a0ced4f9048cdc8bae7332761c3e415
            electron_version: 42.8.0
          - runner: macos-15-intel
            target: darwin-x64
            vscode_version: 1.134.0
            archive_channel: darwin
            archive_sha256: 406c77667b14b4ee7252be317fb14973cca4ba587f96536bebec36b8c3ffdfb4
            electron_version: 42.8.1
          - runner: macos-15
            target: darwin-arm64
            vscode_version: 1.132.0
            archive_channel: darwin-arm64
            archive_sha256: 8f5874dc1fee62f24153a1a9a5f4c3f10bbcc28ff9e8a04fc9f4cdcb6d9d0f6e
            electron_version: 42.7.1
          - runner: macos-15
            target: darwin-arm64
            vscode_version: 1.132.1
            archive_channel: darwin-arm64
            archive_sha256: 57ba6dfc904df79a42b0ce4247a32e8d7400f760b4bd6e608685943c01f4d93d
            electron_version: 42.7.1
          - runner: macos-15
            target: darwin-arm64
            vscode_version: 1.133.0
            archive_channel: darwin-arm64
            archive_sha256: 2b13ff21f640af3b1be9cf2c267fd5f0175f67004ec6e1263535600f382bf42d
            electron_version: 42.8.0
          - runner: macos-15
            target: darwin-arm64
            vscode_version: 1.134.0
            archive_channel: darwin-arm64
            archive_sha256: 6df181646588f0132339d19f5bdfb20bd0d6db05e5801061f12e0dc93c85fa70
            electron_version: 42.8.1

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download canonical compatibility VSIX
        uses: actions/download-artifact@v4
        with:
          name: project-dna-vsix-${{ matrix.target }}
          path: apps/vscode-extension/release

      - name: Assert Linux desktop display wrapper
        if: matrix.target == 'linux-x64'
        shell: bash
        run: command -v xvfb-run

      - name: Validate installed compatibility VSIX in official VS Code Desktop
        working-directory: apps/vscode-extension
        env:
          PROJECT_DNA_EXPECTED_TARGET: ${{ matrix.target }}
          PROJECT_DNA_EXPECTED_VSCODE_VERSION: ${{ matrix.vscode_version }}
          PROJECT_DNA_VSCODE_ARCHIVE_CHANNEL: ${{ matrix.archive_channel }}
          PROJECT_DNA_VSCODE_ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
          PROJECT_DNA_EXPECTED_ELECTRON_VERSION: ${{ matrix.electron_version }}
        run: pnpm validate:installed-desktop

      - name: Upload desktop compatibility logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.target }}-vscode-${{ matrix.vscode_version }}-logs
          path: ${{ runner.temp }}/project-dna-compat-desktop-${{ matrix.vscode_version }}-${{ matrix.target }}/logs
          if-no-files-found: ignore
          retention-days: 7

  compatibility-remote-linux-x64:
    name: compatibility-linux-x64-remote-vscode-${{ matrix.vscode_version }}
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_version: 1.132.1
            vscode_commit: c2d1b13fdc4a77628e5f3bb70173351c8f2fbad1
            archive_sha256: 80f56351be85cbd696f141f50086dce289fb07b8fd3ed67f092a1cb56c7032a8
          - vscode_version: 1.133.0
            vscode_commit: a5b500951314efd502d07465bd138dfbd714a960
            archive_sha256: afdfd9868c417e9df7df4bc50ea87663fcd22bdbfab4e930357be8b49b5a5c20
          - vscode_version: 1.134.0
            vscode_commit: 110a328ea54b42367b803ec53ee0bf52ef26b419
            archive_sha256: 56536bd3501423b618e2795525c0c6d61817a844a3c6abd38613e231327feb65

    steps:
      - name: Configure deterministic line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frozen pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up frozen Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download canonical compatibility VSIX
        uses: actions/download-artifact@v4
        with:
          name: project-dna-vsix-linux-x64
          path: apps/vscode-extension/release

      - name: Install pinned Playwright Chromium
        working-directory: apps/vscode-extension
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/project-dna-playwright-1.62.1
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate installed compatibility VSIX in official VS Code Server
        working-directory: apps/vscode-extension
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/project-dna-playwright-1.62.1
          PROJECT_DNA_EXPECTED_VSCODE_VERSION: ${{ matrix.vscode_version }}
          PROJECT_DNA_EXPECTED_VSCODE_SERVER_COMMIT: ${{ matrix.vscode_commit }}
          PROJECT_DNA_EXPECTED_VSCODE_SERVER_SHA256: ${{ matrix.archive_sha256 }}
        run: pnpm validate:installed-server

      - name: Upload remote compatibility logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-linux-x64-remote-vscode-${{ matrix.vscode_version }}-logs
          path: ${{ runner.temp }}/project-dna-installed-server/logs
          if-no-files-found: ignore
          retention-days: 7

  release-validation-status:
    name: release-validation-status
    if: always()
    needs:
      - native
      - impact-performance
      - package
      - installed-extension-host-linux-x64
      - compatibility-desktop
      - compatibility-remote-linux-x64
    runs-on: ubuntu-22.04
    steps:
      - name: Require every release validation branch
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          PERFORMANCE_RESULT: ${{ needs.impact-performance.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          INSTALLED_HOST_RESULT: ${{ needs.installed-extension-host-linux-x64.result }}
          DESKTOP_COMPATIBILITY_RESULT: ${{ needs.compatibility-desktop.result }}
          REMOTE_COMPATIBILITY_RESULT: ${{ needs.compatibility-remote-linux-x64.result }}
        run: |
          set -euo pipefail
          failed=0
          report() {
            local branch="$1"
            local result="$2"
            printf -- '- %s: %s\n' "$branch" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != success ]; then
              failed=1
            fi
          }
          printf '## Release validation status\n' >> "$GITHUB_STEP_SUMMARY"
          report native "$NATIVE_RESULT"
          report impact-performance "$PERFORMANCE_RESULT"
          report package "$PACKAGE_RESULT"
          report installed-extension-host "$INSTALLED_HOST_RESULT"
          report compatibility-desktop "$DESKTOP_COMPATIBILITY_RESULT"
          report compatibility-remote "$REMOTE_COMPATIBILITY_RESULT"
          test "$failed" -eq 0
